[app]
name = HANAS
full_name = Hydroponic Agentic Nutrient Adjustment System
version = 0.3.8
timezone = Asia/Manila
default_reference_range_id = 3
default_experiment_run_name = HANAS Phase 3 Live Run
default_experiment_phase = phase3
default_control_strategy = agentic_ai
default_reservoir_max_volume_liters = 70.0
minimum_pumpable_reservoir_volume_liters = 20.0
force_fixed_reservoir_volume = false
fixed_reservoir_volume_liters = 70.0
default_sampling_interval_seconds = 60
default_mixing_time_seconds = 300
agentic_base_mixing_time_seconds = 180
default_initial_confirmation_gap_seconds = 30
default_stability_required_seconds = 30
default_ph_stability_threshold = 0.03
default_ec_stability_threshold = 0.03
agentic_history_limit = 180
agentic_control_history_limit = 1440
agentic_history_freshness_gap_seconds = 900
agentic_adaptive_history_window_seconds = 86400
agentic_ai_llm_timeout_seconds = 15.0
agentic_ai_model = gpt-4.1-nano
agentic_ai_monitoring_model = gpt-4.1-mini
agentic_ai_diagnostic_model = gpt-4.1-mini
agentic_ai_dose_planning_model = gpt-4.1-mini
agentic_ai_fallback_model = gpt-4.1-mini
full_agentic_mode_enabled = false
batch_analysis_enabled = true
batch_analysis_interval_seconds = 600
batch_analysis_window_readings = 15
batch_pending_command_expiry_seconds = 900
overview_summary_enabled = true
overview_summary_interval_seconds = 43200
overview_summary_max_readings = 1440
ph_emergency_buffer_below = 0.20
ph_emergency_buffer_above = 0.20
ec_emergency_buffer_below = 0.20
ec_emergency_buffer_above = 0.20
cors_allow_origins = http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177

